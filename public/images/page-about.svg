<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" fill="none" role="img" aria-label="">
  <defs>
    <linearGradient id="a3cBg" x1="0" y1="0" x2="1600" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080917"/><stop offset="0.55" stop-color="#0d0e23"/><stop offset="1" stop-color="#04050c"/>
    </linearGradient>
    <radialGradient id="a3cGlow" cx="0" cy="0" r="1" gradientTransform="translate(1180 340) scale(700 460)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04c4d4" stop-opacity="0.20"/><stop offset="1" stop-color="#04c4d4" stop-opacity="0"/>
    </radialGradient>

    <!-- rigid grid: what everyone else forces you into -->
    <pattern id="a3cRigid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0 L0 0 0 56" fill="none" stroke="#33475c" stroke-width="1.5"/>
    </pattern>

    <!-- the field the rigid grid is allowed to occupy: left third only -->
    <linearGradient id="a3cFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.62" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="a3cMaskL">
      <rect x="0" y="0" width="700" height="600" fill="url(#a3cFade)"/>
    </mask>

    <filter id="a3cGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1600" height="600" fill="url(#a3cBg)"/>
  <rect width="1600" height="600" fill="url(#a3cGlow)"/>

  <!-- LEFT: a rigid, regular grid — the one-size-fits-all model.
       It simply stops, mid-field. -->
  <g mask="url(#a3cMaskL)" opacity="0.55">
    <rect x="0" y="0" width="700" height="600" fill="url(#a3cRigid)"/>
  </g>

  <!-- The break line: where the grid gives way. A single hard vertical
       that tears rather than divides — deliberately irregular. -->
  <path d="M690 -20 L 706 90 L 686 176 L 712 268 L 690 352 L 714 448 L 694 620"
        stroke="#66e7f3" stroke-opacity="0.55" stroke-width="3" fill="none" stroke-linejoin="round"/>

  <!-- RIGHT: the grid re-forms on its own terms — cells of different sizes,
       rotated, spaced by need rather than by rule. Large, few, confident. -->
  <g stroke="#04c4d4" fill="none" stroke-width="2.5">
    <rect x="760" y="72" width="300" height="188" rx="4" stroke-opacity="0.42"/>
    <rect x="1090" y="72" width="180" height="188" rx="4" stroke-opacity="0.26"/>
    <rect x="1300" y="72" width="240" height="110" rx="4" stroke-opacity="0.30"/>

    <rect x="760" y="292" width="180" height="236" rx="4" stroke-opacity="0.28"/>
    <rect x="970" y="292" width="300" height="120" rx="4" stroke-opacity="0.46"/>
    <rect x="970" y="440" width="140" height="88" rx="4" stroke-opacity="0.22"/>
    <rect x="1140" y="440" width="130" height="88" rx="4" stroke-opacity="0.32"/>
    <rect x="1300" y="212" width="240" height="316" rx="4" stroke-opacity="0.24"/>
  </g>

  <!-- three cells filled solid: the three shapes the studio actually takes.
       Solid mass against all that line work — the contrast the earlier
       attempts never had. -->
  <rect x="760" y="72" width="300" height="188" rx="4" fill="#04c4d4" fill-opacity="0.10"/>
  <rect x="970" y="292" width="300" height="120" rx="4" fill="#04c4d4" fill-opacity="0.16"/>
  <rect x="1300" y="212" width="240" height="316" rx="4" fill="#04c4d4" fill-opacity="0.07"/>

  <!-- a few cells that break their own alignment, rotated slightly -->
  <g stroke="#66e7f3" stroke-opacity="0.5" stroke-width="2.5" fill="none">
    <rect x="0" y="0" width="128" height="96" rx="4" transform="translate(752 300) rotate(-6)"/>
    <rect x="0" y="0" width="96" height="72" rx="4" transform="translate(1108 84) rotate(5)"/>
  </g>

  <!-- oversized quiet arc bleeding off the right — scale, negative space -->
  <circle cx="1700" cy="300" r="380" fill="none" stroke="#04c4d4" stroke-opacity="0.10" stroke-width="2"/>
  <circle cx="-120" cy="300" r="300" fill="none" stroke="#04c4d4" stroke-opacity="0.07" stroke-width="2"/>

  <!-- lone solid dot on the break line: the studio itself, small, decisive -->
  <circle cx="700" cy="352" r="9" fill="#66e7f3"/>
  <circle cx="700" cy="352" r="26" fill="none" stroke="#66e7f3" stroke-opacity="0.3" stroke-width="2"/>

  <rect width="1600" height="600" filter="url(#a3cGrain)" opacity="0.5" fill="none"/>
  <rect x="0" y="0" width="1600" height="2" fill="#04c4d4" opacity="0.18"/>
</svg>
