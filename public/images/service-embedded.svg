<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" fill="none" role="img" aria-label="">
  <defs>
    <linearGradient id="emBg" x1="0" y1="0" x2="1600" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080917"/><stop offset="0.5" stop-color="#0d0e23"/><stop offset="1" stop-color="#04050c"/>
    </linearGradient>
    <radialGradient id="emGlow" cx="0" cy="0" r="1" gradientTransform="translate(1120 300) scale(520)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04c4d4" stop-opacity="0.26"/><stop offset="1" stop-color="#04c4d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="emDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#04c4d4"/>
    </pattern>
  </defs>

  <rect width="1600" height="600" fill="url(#emBg)"/>
  <rect width="1600" height="600" fill="url(#emDots)" opacity="0.09"/>
  <rect width="1600" height="600" fill="url(#emGlow)"/>

  <!-- The client's existing team: a row of seats, mostly filled in their own
       neutral colour. One seat is empty (dashed) — that's the gap. -->
  <g transform="translate(150 330)">
    <!-- team baseline -->
    <line x1="0" y1="128" x2="1300" y2="128" stroke="#1e2838" stroke-width="2"/>

    <!-- existing member -->
    <g transform="translate(0 0)">
      <circle cx="46" cy="46" r="34" fill="#101a2b" stroke="#33475c" stroke-width="2.5"/>
      <circle cx="46" cy="37" r="12" fill="#33475c"/>
      <path d="M26 62 a20 20 0 0 1 40 0" fill="#33475c"/>
      <rect x="16" y="96" width="60" height="8" rx="4" fill="#22303f"/>
    </g>
    <g transform="translate(150 0)">
      <circle cx="46" cy="46" r="34" fill="#101a2b" stroke="#33475c" stroke-width="2.5"/>
      <circle cx="46" cy="37" r="12" fill="#33475c"/>
      <path d="M26 62 a20 20 0 0 1 40 0" fill="#33475c"/>
      <rect x="16" y="96" width="60" height="8" rx="4" fill="#22303f"/>
    </g>
    <g transform="translate(300 0)">
      <circle cx="46" cy="46" r="34" fill="#101a2b" stroke="#33475c" stroke-width="2.5"/>
      <circle cx="46" cy="37" r="12" fill="#33475c"/>
      <path d="M26 62 a20 20 0 0 1 40 0" fill="#33475c"/>
      <rect x="16" y="96" width="60" height="8" rx="4" fill="#22303f"/>
    </g>

    <!-- THE GAP, then filled by us: cyan, ringed, clearly the newcomer -->
    <g transform="translate(450 0)">
      <circle cx="46" cy="46" r="52" fill="none" stroke="#04c4d4" stroke-opacity="0.18" stroke-width="2"/>
      <circle cx="46" cy="46" r="34" fill="#0c1a20" stroke="#04c4d4" stroke-width="3"/>
      <circle cx="46" cy="37" r="12" fill="#33dfef"/>
      <path d="M26 62 a20 20 0 0 1 40 0" fill="#33dfef"/>
      <rect x="16" y="96" width="60" height="8" rx="4" fill="#04c4d4" opacity="0.75"/>
    </g>

    <!-- more existing members -->
    <g transform="translate(600 0)">
      <circle cx="46" cy="46" r="34" fill="#101a2b" stroke="#33475c" stroke-width="2.5"/>
      <circle cx="46" cy="37" r="12" fill="#33475c"/>
      <path d="M26 62 a20 20 0 0 1 40 0" fill="#33475c"/>
      <rect x="16" y="96" width="60" height="8" rx="4" fill="#22303f"/>
    </g>

    <!-- second embedded seat, further right -->
    <g transform="translate(750 0)">
      <circle cx="46" cy="46" r="52" fill="none" stroke="#04c4d4" stroke-opacity="0.18" stroke-width="2"/>
      <circle cx="46" cy="46" r="34" fill="#0c1a20" stroke="#04c4d4" stroke-width="3"/>
      <circle cx="46" cy="37" r="12" fill="#33dfef"/>
      <path d="M26 62 a20 20 0 0 1 40 0" fill="#33dfef"/>
      <rect x="16" y="96" width="60" height="8" rx="4" fill="#04c4d4" opacity="0.75"/>
    </g>

    <g transform="translate(900 0)">
      <circle cx="46" cy="46" r="34" fill="#101a2b" stroke="#33475c" stroke-width="2.5"/>
      <circle cx="46" cy="37" r="12" fill="#33475c"/>
      <path d="M26 62 a20 20 0 0 1 40 0" fill="#33475c"/>
      <rect x="16" y="96" width="60" height="8" rx="4" fill="#22303f"/>
    </g>
    <g transform="translate(1050 0)">
      <circle cx="46" cy="46" r="34" fill="#101a2b" stroke="#33475c" stroke-width="2.5"/>
      <circle cx="46" cy="37" r="12" fill="#33475c"/>
      <path d="M26 62 a20 20 0 0 1 40 0" fill="#33475c"/>
      <rect x="16" y="96" width="60" height="8" rx="4" fill="#22303f"/>
    </g>
    <g transform="translate(1200 0)">
      <circle cx="46" cy="46" r="34" fill="#101a2b" stroke="#33475c" stroke-width="2.5"/>
      <circle cx="46" cy="37" r="12" fill="#33475c"/>
      <path d="M26 62 a20 20 0 0 1 40 0" fill="#33475c"/>
      <rect x="16" y="96" width="60" height="8" rx="4" fill="#22303f"/>
    </g>
  </g>

  <!-- shared workflow rail above the team: everyone on the same board -->
  <g transform="translate(150 130)" opacity="0.9">
    <rect x="0" y="0" width="1300" height="120" rx="14" fill="#0a0f19" stroke="#1e2838" stroke-width="2"/>
    <line x1="0" y1="38" x2="1300" y2="38" stroke="#1e2838" stroke-width="2"/>
    <circle cx="26" cy="19" r="5" fill="#33475c"/>
    <circle cx="44" cy="19" r="5" fill="#33475c"/>
    <circle cx="62" cy="19" r="5" fill="#33475c"/>

    <!-- kanban-ish columns, one card cyan = our work in their flow -->
    <g transform="translate(28 56)">
      <rect x="0" y="0" width="180" height="46" rx="9" fill="#101a2b"/>
      <rect x="16" y="14" width="90" height="8" rx="4" fill="#33475c"/>
      <rect x="16" y="30" width="60" height="6" rx="3" fill="#22303f"/>

      <rect x="200" y="0" width="180" height="46" rx="9" fill="#101a2b"/>
      <rect x="216" y="14" width="72" height="8" rx="4" fill="#33475c"/>
      <rect x="216" y="30" width="96" height="6" rx="3" fill="#22303f"/>

      <rect x="400" y="0" width="180" height="46" rx="9" fill="#0e2630" stroke="#04c4d4" stroke-opacity="0.45" stroke-width="2"/>
      <rect x="416" y="14" width="84" height="8" rx="4" fill="#33dfef" opacity="0.8"/>
      <rect x="416" y="30" width="54" height="6" rx="3" fill="#33475c"/>

      <rect x="600" y="0" width="180" height="46" rx="9" fill="#101a2b"/>
      <rect x="616" y="14" width="96" height="8" rx="4" fill="#33475c"/>
      <rect x="616" y="30" width="62" height="6" rx="3" fill="#22303f"/>

      <rect x="800" y="0" width="180" height="46" rx="9" fill="#0e2630" stroke="#04c4d4" stroke-opacity="0.45" stroke-width="2"/>
      <rect x="816" y="14" width="70" height="8" rx="4" fill="#33dfef" opacity="0.8"/>
      <rect x="816" y="30" width="88" height="6" rx="3" fill="#33475c"/>

      <rect x="1000" y="0" width="180" height="46" rx="9" fill="#101a2b"/>
      <rect x="1016" y="14" width="82" height="8" rx="4" fill="#33475c"/>
      <rect x="1016" y="30" width="58" height="6" rx="3" fill="#22303f"/>
    </g>
  </g>

  <!-- connector lines from the two embedded seats up into the shared board -->
  <g stroke="#04c4d4" stroke-opacity="0.35" stroke-width="2.5" stroke-dasharray="6 8">
    <line x1="646" y1="330" x2="646" y2="250"/>
    <line x1="946" y1="330" x2="946" y2="250"/>
  </g>

  <rect x="0" y="0" width="1600" height="2" fill="#04c4d4" opacity="0.18"/>
</svg>
