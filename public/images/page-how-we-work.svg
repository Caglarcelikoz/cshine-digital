<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" fill="none" role="img" aria-label="">
  <defs>
    <linearGradient id="hwaBg" x1="0" y1="0" x2="1600" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080917"/><stop offset="0.5" stop-color="#0d0e23"/><stop offset="1" stop-color="#04050c"/>
    </linearGradient>
    <radialGradient id="hwaGlowL" cx="0" cy="0" r="1" gradientTransform="translate(240 300) scale(440)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04c4d4" stop-opacity="0.20"/><stop offset="1" stop-color="#04c4d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hwaGlowR" cx="0" cy="0" r="1" gradientTransform="translate(1360 300) scale(500)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04c4d4" stop-opacity="0.26"/><stop offset="1" stop-color="#04c4d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hwaDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#04c4d4"/>
    </pattern>
    <linearGradient id="hwaSpine" x1="120" y1="300" x2="800" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04c4d4" stop-opacity="0.3"/><stop offset="1" stop-color="#66e7f3" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#hwaBg)"/>
  <rect width="1600" height="600" fill="url(#hwaDots)" opacity="0.09"/>
  <rect width="1600" height="600" fill="url(#hwaGlowL)"/>
  <rect width="1600" height="600" fill="url(#hwaGlowR)"/>

  <!-- The shared spine forking into three tracks — mirrors the new
       homepage structure: same start, different path. -->

  <!-- spine -->
  <path d="M130 300 L 800 300" stroke="url(#hwaSpine)" stroke-width="4" stroke-linecap="round"/>

  <!-- three shared steps as numbered nodes on the spine -->
  <g transform="translate(190 300)">
    <circle cx="0" cy="0" r="34" fill="#0c1a20" stroke="#04c4d4" stroke-opacity="0.5" stroke-width="3"/>
    <circle cx="0" cy="0" r="9" fill="#33dfef"/>
    <rect x="-42" y="56" width="84" height="9" rx="4.5" fill="#33475c"/>
    <rect x="-30" y="74" width="60" height="7" rx="3.5" fill="#22303f"/>
  </g>
  <g transform="translate(400 300)">
    <circle cx="0" cy="0" r="34" fill="#0c1a20" stroke="#04c4d4" stroke-opacity="0.6" stroke-width="3"/>
    <circle cx="0" cy="0" r="9" fill="#33dfef"/>
    <rect x="-42" y="56" width="84" height="9" rx="4.5" fill="#33475c"/>
    <rect x="-30" y="74" width="60" height="7" rx="3.5" fill="#22303f"/>
  </g>
  <g transform="translate(610 300)">
    <circle cx="0" cy="0" r="34" fill="#0c1a20" stroke="#04c4d4" stroke-opacity="0.75" stroke-width="3"/>
    <circle cx="0" cy="0" r="9" fill="#66e7f3"/>
    <rect x="-42" y="56" width="84" height="9" rx="4.5" fill="#33475c"/>
    <rect x="-30" y="74" width="60" height="7" rx="3.5" fill="#22303f"/>
  </g>

  <!-- fork point -->
  <g transform="translate(800 300)">
    <circle cx="0" cy="0" r="46" fill="none" stroke="#04c4d4" stroke-opacity="0.18" stroke-width="2"/>
    <circle cx="0" cy="0" r="26" fill="#0c1a20" stroke="#66e7f3" stroke-width="3.5"/>
  </g>

  <!-- three tracks diverging right -->
  <path d="M826 292 C 900 250, 960 168, 1080 158" stroke="#04c4d4" stroke-opacity="0.7" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M828 300 L 1080 300" stroke="#04c4d4" stroke-opacity="0.7" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M826 308 C 900 350, 960 432, 1080 442" stroke="#04c4d4" stroke-opacity="0.7" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- track 1: build -->
  <g transform="translate(1100 96)">
    <rect x="0" y="0" width="300" height="124" rx="14" fill="#0a0f19" stroke="#04c4d4" stroke-opacity="0.32" stroke-width="2"/>
    <line x1="0" y1="34" x2="300" y2="34" stroke="#1e2838" stroke-width="2"/>
    <circle cx="20" cy="17" r="4.5" fill="#33475c"/>
    <circle cx="35" cy="17" r="4.5" fill="#33475c"/>
    <circle cx="50" cy="17" r="4.5" fill="#33475c"/>
    <rect x="22" y="52" width="128" height="12" rx="6" fill="#eaf1f2" opacity="0.85"/>
    <rect x="22" y="74" width="212" height="8" rx="4" fill="#3a4a5a"/>
    <rect x="22" y="94" width="84" height="14" rx="7" fill="#04c4d4"/>
  </g>

  <!-- track 2: run -->
  <g transform="translate(1100 238)">
    <rect x="0" y="0" width="300" height="124" rx="14" fill="#0a0f19" stroke="#04c4d4" stroke-opacity="0.32" stroke-width="2"/>
    <g transform="translate(22 20)">
      <rect x="0" y="0" width="256" height="24" rx="7" fill="#101a2b"/>
      <circle cx="16" cy="12" r="6" fill="#33dfef" opacity="0.8"/>
      <rect x="32" y="8" width="86" height="8" rx="4" fill="#33475c"/>
      <circle cx="238" cy="12" r="5" fill="#3ddc97"/>
      <rect x="0" y="30" width="256" height="24" rx="7" fill="#101a2b"/>
      <circle cx="16" cy="42" r="6" fill="#33dfef" opacity="0.6"/>
      <rect x="32" y="38" width="108" height="8" rx="4" fill="#33475c"/>
      <circle cx="238" cy="42" r="5" fill="#3ddc97"/>
      <rect x="0" y="60" width="256" height="24" rx="7" fill="#0e2630"/>
      <circle cx="16" cy="72" r="6" fill="#04c4d4"/>
      <rect x="32" y="68" width="72" height="8" rx="4" fill="#eaf1f2" opacity="0.55"/>
      <circle cx="238" cy="72" r="5" fill="#3ddc97"/>
    </g>
  </g>

  <!-- track 3: embed -->
  <g transform="translate(1100 380)">
    <rect x="0" y="0" width="300" height="124" rx="14" fill="#0a0f19" stroke="#04c4d4" stroke-opacity="0.32" stroke-width="2"/>
    <rect x="22" y="22" width="104" height="9" rx="4.5" fill="#33475c"/>
    <g transform="translate(22 46)">
      <circle cx="22" cy="22" r="21" fill="#101a2b" stroke="#33475c" stroke-width="2.5"/>
      <circle cx="22" cy="17" r="7" fill="#33475c"/>
      <path d="M10 32 a12 12 0 0 1 24 0" fill="#33475c"/>
      <circle cx="76" cy="22" r="21" fill="#0c1a20" stroke="#04c4d4" stroke-width="3"/>
      <circle cx="76" cy="17" r="7" fill="#33dfef"/>
      <path d="M64 32 a12 12 0 0 1 24 0" fill="#33dfef"/>
      <circle cx="130" cy="22" r="21" fill="#101a2b" stroke="#33475c" stroke-width="2.5"/>
      <circle cx="130" cy="17" r="7" fill="#33475c"/>
      <path d="M118 32 a12 12 0 0 1 24 0" fill="#33475c"/>
      <circle cx="184" cy="22" r="21" fill="#0c1a20" stroke="#04c4d4" stroke-width="3"/>
      <circle cx="184" cy="17" r="7" fill="#33dfef"/>
      <path d="M172 32 a12 12 0 0 1 24 0" fill="#33dfef"/>
    </g>
  </g>

  <rect x="0" y="0" width="1600" height="2" fill="#04c4d4" opacity="0.18"/>
</svg>
