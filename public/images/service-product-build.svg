<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" fill="none" role="img" aria-label="">
  <defs>
    <linearGradient id="pbBg" x1="0" y1="0" x2="1600" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080917"/><stop offset="0.5" stop-color="#0d0e23"/><stop offset="1" stop-color="#04050c"/>
    </linearGradient>
    <radialGradient id="pbGlowR" cx="0" cy="0" r="1" gradientTransform="translate(1320 120) scale(520)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04c4d4" stop-opacity="0.30"/><stop offset="1" stop-color="#04c4d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pbGlowL" cx="0" cy="0" r="1" gradientTransform="translate(220 520) scale(460)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04c4d4" stop-opacity="0.18"/><stop offset="1" stop-color="#04c4d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pbDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#04c4d4"/>
    </pattern>
    <linearGradient id="pbArc" x1="180" y1="480" x2="1420" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04c4d4" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#33dfef" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#66e7f3" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#pbBg)"/>
  <rect width="1600" height="600" fill="url(#pbDots)" opacity="0.09"/>
  <rect width="1600" height="600" fill="url(#pbGlowR)"/>
  <rect width="1600" height="600" fill="url(#pbGlowL)"/>

  <!-- LEFT: blank page / blueprint being drafted -->
  <g transform="translate(120 150)" opacity="0.85">
    <rect x="0" y="0" width="200" height="270" rx="14" fill="#0a0f19" stroke="#1e2838" stroke-width="2"/>
    <rect x="26" y="34" width="120" height="12" rx="6" fill="#33475c"/>
    <rect x="26" y="62" width="148" height="8" rx="4" fill="#22303f"/>
    <rect x="26" y="80" width="120" height="8" rx="4" fill="#22303f"/>
    <rect x="26" y="112" width="96" height="8" rx="4" fill="#1b2733"/>
    <rect x="26" y="130" width="130" height="8" rx="4" fill="#1b2733"/>
    <g stroke="#04c4d4" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="7 7">
      <rect x="26" y="168" width="148" height="74" rx="9" fill="none"/>
    </g>
    <path d="M88 195 L100 207 L112 195" stroke="#04c4d4" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="100" y1="188" x2="100" y2="216" stroke="#04c4d4" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ARC: idea -> product, the through-line of this mode -->
  <path d="M340 430 C 620 430, 780 220, 1080 200 S 1330 175, 1400 168"
        stroke="url(#pbArc)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <g fill="#33dfef">
    <circle cx="520" cy="392" r="5" opacity="0.5"/>
    <circle cx="760" cy="280" r="5.5" opacity="0.7"/>
    <circle cx="1010" cy="208" r="6" opacity="0.9"/>
  </g>

