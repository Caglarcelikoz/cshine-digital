    <rect x="0" y="0" width="330" height="330" rx="18" fill="#0c111c" stroke="#04c4d4" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="0" y1="46" x2="330" y2="46" stroke="#1e2838" stroke-width="2"/>
    <circle cx="26" cy="23" r="5" fill="#33475c"/>
    <circle cx="44" cy="23" r="5" fill="#33475c"/>
    <circle cx="62" cy="23" r="5" fill="#33475c"/>
    <rect x="220" y="17" width="42" height="12" rx="6" fill="#33475c"/>
    <rect x="270" y="17" width="42" height="12" rx="6" fill="#33475c"/>

    <rect x="30" y="80" width="190" height="18" rx="9" fill="#eaf1f2" opacity="0.92"/>
    <rect x="30" y="112" width="262" height="10" rx="5" fill="#3a4a5a"/>
    <rect x="30" y="132" width="220" height="10" rx="5" fill="#2a3644"/>

    <rect x="30" y="172" width="126" height="42" rx="11" fill="#04c4d4"/>
    <rect x="60" y="188" width="66" height="9" rx="4.5" fill="#04121a" opacity="0.8"/>
    <rect x="168" y="172" width="110" height="42" rx="11" fill="none" stroke="#33dfef" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="194" y="188" width="60" height="9" rx="4.5" fill="#33dfef" opacity="0.7"/>

