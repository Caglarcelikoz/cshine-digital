      <rect x="14" y="16" width="40" height="16" rx="4" fill="#33dfef" opacity="0.85"/>
      <rect x="14" y="40" width="52" height="7" rx="3.5" fill="#33475c"/>
      <rect x="91" y="0" width="80" height="62" rx="11" fill="#101a2b"/>
      <rect x="105" y="16" width="40" height="16" rx="4" fill="#33dfef" opacity="0.6"/>
      <rect x="105" y="40" width="52" height="7" rx="3.5" fill="#33475c"/>
      <rect x="182" y="0" width="80" height="62" rx="11" fill="#101a2b"/>
      <rect x="196" y="16" width="40" height="16" rx="4" fill="#33dfef" opacity="0.6"/>
      <rect x="196" y="40" width="52" height="7" rx="3.5" fill="#33475c"/>
    </g>
  </g>

  <!-- LIVE badge, top-right of the product -->
  <g transform="translate(1400 96)">
    <rect x="0" y="0" width="58" height="24" rx="12" fill="#10241b" stroke="#2f9e6f" stroke-opacity="0.55" stroke-width="1.5"/>
